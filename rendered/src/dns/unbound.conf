# Local DNS settings
# pfSense admin console >> Services >> DNS Resolver >> General Settings >> Custom options
# Ref:
# https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html#unbound-conf-local-data
# https://docs.netgate.com/pfsense/en/latest/services/dns/resolver-config.html
# https://serverfault.com/questions/659990/unbound-exceptions-to-local-zone-rules-for-specific-subdomains-and-main-domain
server:
    local-zone: "vpn.janedoe.com." transparent
    # Redirect other subdomains to a machine on the LAN

    # Hosts
    local-zone: "pve1.janedoe.com." redirect
    local-data: "pve1.janedoe.com. A 192.168.4.10"
    local-zone: "pve2.janedoe.com." redirect
    local-data: "pve2.janedoe.com. A 192.168.2.10"
    local-zone: "pbs2.janedoe.com." redirect
    local-data: "pbs2.janedoe.com. A 192.168.2.10"

    # VMs
    local-zone: "router.janedoe.com." redirect
    local-data: "router.janedoe.com. A 192.168.1.1"
    local-zone: "secsvcs.janedoe.com." redirect
    local-data: "secsvcs.janedoe.com. A 192.168.4.20"
    local-zone: "websvcs.janedoe.com." redirect
    local-data: "websvcs.janedoe.com. A 192.168.2.20"
    local-zone: "gaming.janedoe.com." redirect
    local-data: "gaming.janedoe.com. A 192.168.2.21"
    local-zone: "devtop.janedoe.com." redirect
    local-data: "devtop.janedoe.com. A 192.168.2.22"
    local-zone: "homesvcs.janedoe.com." redirect
    local-data: "homesvcs.janedoe.com. A 192.168.4.21"
    
    # secsvcs routes

    local-zone: "alert.janedoe.com." redirect
    local-data: "alert.janedoe.com. A 192.168.4.20"
    local-zone: "auth.janedoe.com." redirect
    local-data: "auth.janedoe.com. A 192.168.4.20"
    local-zone: "command.janedoe.com." redirect
    local-data: "command.janedoe.com. A 192.168.4.20"
    local-zone: "graph.janedoe.com." redirect
    local-data: "graph.janedoe.com. A 192.168.4.20"
    local-zone: "ldap.janedoe.com." redirect
    local-data: "ldap.janedoe.com. A 192.168.4.20"
    local-zone: "logs.janedoe.com." redirect
    local-data: "logs.janedoe.com. A 192.168.4.20"
    local-zone: "metrics.janedoe.com." redirect
    local-data: "metrics.janedoe.com. A 192.168.4.20"
    local-zone: "ntfy-alertmanager.janedoe.com." redirect
    local-data: "ntfy-alertmanager.janedoe.com. A 192.168.4.20"
    local-zone: "push.janedoe.com." redirect
    local-data: "push.janedoe.com. A 192.168.4.20"
    local-zone: "secproxy.janedoe.com." redirect
    local-data: "secproxy.janedoe.com. A 192.168.4.20"
    local-zone: "uptime.janedoe.com." redirect
    local-data: "uptime.janedoe.com. A 192.168.4.20"
    local-zone: "vmalert.janedoe.com." redirect
    local-data: "vmalert.janedoe.com. A 192.168.4.20"
    # Internal only routes
    local-zone: "pgdb.janedoe.com." redirect
    local-data: "pgdb.janedoe.com. A 192.168.4.20"
    # Mail records
    local-data: "push.janedoe.com. IN MX 10 push.janedoe.com."

    # homesvcs routes

    local-zone: "home.janedoe.com." redirect
    local-data: "home.janedoe.com. A 192.168.4.21"
    local-zone: "homeproxy.janedoe.com." redirect
    local-data: "homeproxy.janedoe.com. A 192.168.4.21"
    local-zone: "iot.janedoe.com." redirect
    local-data: "iot.janedoe.com. A 192.168.4.21"
    local-zone: "zigbee.janedoe.com." redirect
    local-data: "zigbee.janedoe.com. A 192.168.4.21"
    # Internal only routes
    local-zone: "mqtt.janedoe.com." redirect
    local-data: "mqtt.janedoe.com. A 192.168.4.21"

    # SBCs and IoT

    # the rest (websvcs)
    # Main proxy endpoint, points to most web services
    # Set "System Domain Local Zone Type" to "Redirect"
    local-data: "janedoe.com. A 192.168.2.20"
