; /etc/opt/isso/homesite.cfg
; Ref:
;   https://isso-comments.de/docs/reference/server-config
;   https://docs.ntfy.sh/config/#e-mail-publishing

[general]
dbpath = /var/lib/isso/comments.db
name = homesite
host =
  http://janedoe.com/
  http://www.janedoe.com/
  https://janedoe.com/
  https://www.janedoe.com/
max-age = 1h
; log-file =
notify = smtp
reply-notifications = true
gravatar = true
gravatar-url = https://www.gravatar.com/avatar/{}?d=identicon&s=55
latest-enabled = true

[server]
listen = http://0.0.0.0:8200
public-endpoint = https://comment.janedoe.com
reload = false
profile = false
trusted-proxies =
  10.11.0.6
samesite = None ; for cross-site cookies, served over HTTPS

[moderation]
enabled = true
approve-if-email-previously-approved = false
purge-after = 30d

[smtp]
username =
password =
host = push.janedoe.com
port = 465
security = ssl
to = ntfy-comment+${NTFY_ALERT_ACCESS_TOKEN}@push.janedoe.com
from = comments-mod@janedoe.com
timeout = 10

[guard]
enabled = true
ratelimit = 5
direct-reply = 5
reply-to-self = false
require-author = false
require-email = false

[markup]
options = strikethrough, superscript, autolink, fenced-code
; flags =
; allowed-elements =
; allowed-attributes =

[hash]
salt = ${EMAIL_HASH_SALT}
algorithm = pbkdf2

; [rss]
; base =
; limit = 100

; /admin
[admin]
enabled = true
password = ${ADMIN_PASSWORD}

