# /etc/opt/vmagent/prometheus.yml
# Ref: https://prometheus.io/docs/prometheus/latest/configuration/configuration
# Everything on the VPS listens on loopback and vmagent runs on the host network, so
# the targets are 127.0.0.1; `instance` names the node as on the other VMs, and `host`
# is the node without a port (ntfy-alertmanager tags on it).
---
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'haproxy'
    # The built-in exporter, a frontend on loopback (src/haproxy/haproxy.cfg.j2)
    static_configs:
      - targets: ['127.0.0.1:8405']
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: vpnsvcs.janedoe.com:8405
      - target_label: host
        replacement: vpnsvcs.janedoe.com
  - job_name: 'headscale'
    # metrics_listen_addr in src/headscale/headscale.yaml.j2
    static_configs:
      - targets: ['127.0.0.1:9090']
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: vpnsvcs.janedoe.com:9090
      - target_label: host
        replacement: vpnsvcs.janedoe.com
  - job_name: 'tailscaled'
    # Client metrics, tailscale >= 1.78: https://tailscale.com/kb/1482/client-metrics
    static_configs:
      - targets: ['100.100.100.100:80']
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: vpnsvcs.janedoe.com:tailscaled
      - target_label: host
        replacement: vpnsvcs.janedoe.com
  - job_name: 'vmagent'
    static_configs:
      - targets: ['127.0.0.1:8429']
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: vpnsvcs.janedoe.com:8429
      - target_label: host
        replacement: vpnsvcs.janedoe.com
  - job_name: 'fluentbit'
    static_configs:
      - targets: ['127.0.0.1:2020']
    metrics_path: /api/v1/metrics/prometheus
    relabel_configs:
      - target_label: instance
        replacement: vpnsvcs.janedoe.com:2020
      - target_label: host
        replacement: vpnsvcs.janedoe.com
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['127.0.0.1:9100']
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: vpnsvcs.janedoe.com:9100
      - target_label: host
        replacement: vpnsvcs.janedoe.com
...
