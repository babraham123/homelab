# /etc/containers/containers.conf
# Ref: https://docs.podman.io/en/latest/markdown/podman.1.html#configuration-files
# https://github.com/containers/podman/issues/18387
# https://github.com/containers/common/blob/main/pkg/secrets/shelldriver/shelldriver.go

# The helpers run in place from the rendered tree (root only), so a deploy updates them.
[secrets]
driver = "shell"

[secrets.opts]
list = '/root/homelab-rendered/src/podman/list_secrets.sh'
lookup = '/root/homelab-rendered/src/podman/get_secret_by_id.sh'
store = 'true'
delete = 'true'
