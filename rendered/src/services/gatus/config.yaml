# /etc/opt/gatus/config.yaml
# Ref: https://github.com/TwiN/gatus?tab=readme-ov-file
---
metrics: true

web:
  port: 8080

storage:
  type: postgres
  path: "postgres://gatus@pgdb.janedoe.com:5432/gatus"

# The weekly backup run: src/nodes/pve1/backup_orchestrator.timer
maintenance:
  start: "02:00"
  duration: 3h
  timezone: "America/Los_Angeles"
  every: [Saturday]

public-endpoint: &public
  group: public
  interval: 10m
  client:
    timeout: 10s
    dns-resolver: udp://1.1.1.1:53
  headers:
    User-Agent: "Mozilla/5.0 (gatus-robot; Linux x86_64)"
  conditions:
    - "[STATUS] == 200"
    - "[RESPONSE_TIME] < 1000"
    # ACME renews at 30 days out, so this only fires once renewal has been failing.
    - "[CERTIFICATE_EXPIRATION] > 336h"

internal-endpoint: &internal
  group: internal
  interval: 10m
  client:
    timeout: 10s
    dns-resolver: udp://1.1.1.1:53
    # https://www.authelia.com/integration/openid-connect/oauth-2.0-bearer-token-usage
    # https://www.authelia.com/integration/openid-connect/uptime-kuma/
    oauth2:
      # Don't use :9091, gatus uses external DNS
      token-url: https://auth.janedoe.com/api/oidc/token
      client-id: ${OIDC_CLIENT_ID}
      client-secret: ${OIDC_CLIENT_SECRET}
      scopes: ['authelia.bearer.authz']
  headers:
    User-Agent: "Mozilla/5.0 (gatus-robot; Linux x86_64)"
  conditions:
    - "[STATUS] == 200"
    - "[RESPONSE_TIME] < 1000"
    # ACME renews at 30 days out, so this only fires once renewal has been failing.
    - "[CERTIFICATE_EXPIRATION] > 336h"

# Tier 1: the proxies, the login portal and the pages opened first. 2 minutes on
# these ~8 endpoints is ~4 requests a minute at HAProxy, nothing against its
# stick-table limits (conn_rate(3s) > 50). Every check passes through Authelia's
# ForwardAuth, so when auth is down every endpoint fails; Alertmanager inhibits the
# rest behind the authelia EndpointDown (src/services/alertmanager/config.yml.j2.j2).
tier1-endpoint: &tier1
  <<: *internal
  interval: 2m

endpoints:
  # - name: personal site
    # <<: *public
    # url: "https://janedoe.com"

  # Internal endpoints come from the uptime entries in src/nodes/*/inventory.yml. A merge key
  # replaces lists, so extra conditions repeat the anchor's.

  - name: traefik homesvcs
    <<: *tier1
    url: "https://homeproxy.janedoe.com"

  - name: zigbee2mqtt
    <<: *internal
    url: "https://zigbee.janedoe.com"

  - name: home assistant
    <<: *tier1
    url: "https://home.janedoe.com"

  - name: authelia
    <<: *tier1
    url: "https://auth.janedoe.com/api/health"
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1000"
      - "[CERTIFICATE_EXPIRATION] > 336h"
      - "[BODY].status == OK"

  - name: traefik secsvcs
    <<: *tier1
    url: "https://secproxy.janedoe.com"

  - name: victoriametrics
    <<: *internal
    url: "https://metrics.janedoe.com"

  - name: victorialogs
    <<: *internal
    url: "https://logs.janedoe.com"

  - name: vmalert
    <<: *internal
    url: "https://vmalert.janedoe.com"

  - name: alertmanager
    <<: *internal
    url: "https://alert.janedoe.com"

  - name: ntfy health check
    <<: *tier1
    url: "https://push.janedoe.com/v1/health"

  - name: grafana
    <<: *tier1
    url: "https://graph.janedoe.com"

  - name: olive_tin
    <<: *internal
    url: "https://command.janedoe.com"

  - name: traefik websvcs
    <<: *tier1
    url: "https://webproxy.janedoe.com"

  - name: homepage
    <<: *tier1
    url: "https://dash.janedoe.com"

  - name: guacamole
    <<: *internal
    url: "https://remote.janedoe.com"

  - name: linkding
    <<: *internal
    url: "https://archive.janedoe.com/health"

  - name: readeck
    <<: *internal
    url: "https://read.janedoe.com/api/info"

  - name: storyteller
    <<: *internal
    url: "https://books.janedoe.com/api/health"


  # Internal CA, year-long certs (src/base/certificates/self_signed_cert_gen.sh). LDAPS is
  # the one TLS-on-connect service without client-certificate auth: Postgres negotiates
  # TLS after connecting and Mosquitto requires a client certificate, so cert_notifier
  # covers those. No dns-resolver here: the container's resolver is the internal DNS.
  - name: lldap tls
    group: internal
    interval: 1h
    url: "tls://ldap.janedoe.com:6360"
    client:
      timeout: 10s
    conditions:
      - "[CONNECTED] == true"
      - "[CERTIFICATE_EXPIRATION] > 720h"

