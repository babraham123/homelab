# File contains default list of alerts for vmagent service.
# The alerts below are just recommendations and may require some updates
# and threshold calibration according to every specific setup.
---
groups:
  # Alerts group for vmagent assumes that Grafana dashboard
  # https://grafana.com/grafana/dashboards/12683/ is installed.
  # Pls update the `dashboard` annotation according to your setup.
  # Summaries name the node: every node's vmagent carries the same instance label.
  # Scrape failures are TargetDown and NodeDown (homelab.yml), which name the target.
  - name: vmagent
    interval: 30s
    concurrency: 2
    rules:
      - alert: PersistentQueueIsDroppingData
        expr: sum(increase(vm_persistentqueue_bytes_dropped_total[5m])) without (path) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          dashboard: "{{ $externalURL }}/d/G7Z9GzMGz_vm?viewPanel=49&var-instance={{ $labels.instance }}"
          summary: "{{ $labels.job }} on {{ $labels.host }} is dropping data from its persistent queue"
          description: "Vmagent dropped {{ $value | humanize1024 }} from persistent queue
              on {{ $labels.host }} for the last 10m."

      - alert: RejectedRemoteWriteDataBlocksAreDropped
        expr: sum(increase(vmagent_remotewrite_packets_dropped_total[5m])) without (url) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/G7Z9GzMGz_vm?viewPanel=79&var-instance={{ $labels.instance }}"
          summary: "{{ $labels.job }} on {{ $labels.host }} drops the rejected by
            remote-write server data blocks. Check the logs to find the reason for rejects."

      - alert: TooManyWriteErrors
        expr: |
          (sum(increase(vm_ingestserver_request_errors_total[5m])) without (name,net,type)
          +
          sum(increase(vmagent_http_request_errors_total[5m])) without (path,protocol)) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/G7Z9GzMGz_vm?viewPanel=77&var-instance={{ $labels.instance }}"
          summary: "{{ $labels.job }} on {{ $labels.host }} responds with errors to write requests for last 15m."

      - alert: TooManyRemoteWriteErrors
        expr: rate(vmagent_remotewrite_retries_count_total[5m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/G7Z9GzMGz_vm?viewPanel=61&var-instance={{ $labels.instance }}"
          summary: "{{ $labels.job }} on {{ $labels.host }} fails to push to remote storage"
          description: "Vmagent fails to push data via remote write protocol to destination \"{{ $labels.url }}\"\n
            Ensure that destination is up and reachable."

      - alert: RemoteWriteConnectionIsSaturated
        expr: |
          (
           rate(vmagent_remotewrite_send_duration_seconds_total[5m])
           / vmagent_remotewrite_queues
          ) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/G7Z9GzMGz_vm?viewPanel=84&var-instance={{ $labels.instance }}"
          summary: "Remote write connection from {{ $labels.job }} on {{ $labels.host }} to {{ $labels.url }} is saturated"
          description: "The remote write connection between {{ $labels.job }} on {{ $labels.host }} and destination \"{{ $labels.url }}\"
            is saturated by more than 90% and vmagent won't be able to keep up.\n
            This usually means that `-remoteWrite.queues` command-line flag must be increased in order to increase the number of connections per each remote storage."

      - alert: PersistentQueueForWritesIsSaturated
        expr: rate(vm_persistentqueue_write_duration_seconds_total[5m]) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/G7Z9GzMGz_vm?viewPanel=98&var-instance={{ $labels.instance }}"
          summary: "Persistent queue writes for {{ $labels.job }} on {{ $labels.host }} are saturated"
          description: "Persistent queue writes for {{ $labels.job }} on {{ $labels.host }}
            are saturated by more than 90% and vmagent won't be able to keep up with flushing data on disk.
            In this case, consider to decrease load on the vmagent or improve the disk throughput."

      - alert: PersistentQueueForReadsIsSaturated
        expr: rate(vm_persistentqueue_read_duration_seconds_total[5m]) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/G7Z9GzMGz_vm?viewPanel=99&var-instance={{ $labels.instance }}"
          summary: "Persistent queue reads for {{ $labels.job }} on {{ $labels.host }} are saturated"
          description: "Persistent queue reads for {{ $labels.job }} on {{ $labels.host }}
            are saturated by more than 90% and vmagent won't be able to keep up with reading data from the disk.
            In this case, consider to decrease load on the vmagent or improve the disk throughput."

      - alert: ConfigurationReloadFailure
        expr: |
          vm_promscrape_config_last_reload_successful != 1
          or
          vmagent_relabel_config_last_reload_successful != 1
        labels:
          severity: warning
        annotations:
          summary: "Configuration reload failed for {{ $labels.job }} on {{ $labels.host }}"
          description: "Configuration hot-reload failed for {{ $labels.job }} on {{ $labels.host }}.
            Check vmagent's logs for detailed error message."
...
