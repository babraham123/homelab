# Host, scrape, auth, uptime and cert-expiry alerts. Every VM and host runs
# node_exporter (src/base/node_exporter/node_runner.sh), scraped by its node's collector as
# job node_exporter (VMs) or node_exporter_pve (pve1, pve2). Backups are in
# backups.yml; the VictoriaMetrics components have their own upstream files.
# Severity is what ntfy-alertmanager maps to a push priority: critical (5), error (4),
# warning (3), info (1).
---
groups:
  - name: hosts
    rules:
      - alert: NodeDown
        expr: up{job=~"node_exporter.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          dashboard: "{{ $externalURL }}/d/rYdddlPWk?var-node={{ $labels.instance }}"
          summary: "{{ $labels.host }} is not answering node_exporter scrapes"
          description: "The host is down, node_exporter stopped, or its collector can't reach it (ufw, pve host up?)."
      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_size_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/rYdddlPWk?var-node={{ $labels.instance }}"
          summary: "{{ $labels.mountpoint }} on {{ $labels.host }} has {{ $value | humanizePercentage }} free"
          description: "Podman images and journald are the usual growth on the VMs: podman image prune, journalctl --vacuum-size."
      - alert: DiskFillingIn24h
        # Only once under 30% so a fresh VM's first image pulls don't extrapolate to full.
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}[6h], 24 * 3600) < 0
            and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.30
        for: 1h
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/rYdddlPWk?var-node={{ $labels.instance }}"
          summary: "{{ $labels.mountpoint }} on {{ $labels.host }} fills up within a day at the current rate"
      - alert: MemoryPressure
        # The hosts' guest RAM is committed up front, so pve1 sits at 8-11% available with
        # swap untouched: lower bar there, and OomKill is the signal that matters.
        expr: |
          node_memory_MemAvailable_bytes{job!="node_exporter_pve"} / node_memory_MemTotal_bytes < 0.10
            or node_memory_MemAvailable_bytes{job="node_exporter_pve"} / node_memory_MemTotal_bytes < 0.05
        for: 30m
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/rYdddlPWk?var-node={{ $labels.instance }}"
          summary: "{{ $labels.host }} has {{ $value | humanizePercentage }} of memory available"
      - alert: OomKill
        expr: increase(node_vmstat_oom_kill[1h]) > 0
        labels:
          severity: error
        annotations:
          dashboard: "{{ $externalURL }}/d/rYdddlPWk?var-node={{ $labels.instance }}"
          summary: "The kernel on {{ $labels.host }} killed a process for memory"
          description: "journalctl -k on the node names the victim; on a host that can be a VM."
      - alert: HighLoad
        expr: node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/rYdddlPWk?var-node={{ $labels.instance }}"
          summary: "{{ $labels.host }} load15 is {{ $value | printf \"%.1f\" }} per core"
      - alert: HighCpuTemp
        # Only the hosts have sensors; pve1 is fanless.
        expr: node_hwmon_temp_celsius > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/rYdddlPWk?var-node={{ $labels.instance }}"
          summary: "{{ $labels.host }} {{ $labels.chip }} {{ $labels.sensor }} is at {{ $value }}°C"
      - alert: SystemdUnitFailed
        # node_runner.sh exports only the "Homelab:" units, so this is every quadlet,
        # the host services and the backup orchestrator; a restart loop ends up here.
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: error
        annotations:
          dashboard: "{{ $externalURL }}/d/rYdddlPWk?var-node={{ $labels.instance }}"
          summary: "{{ $labels.name }} failed on {{ $labels.host }}"
          description: "journalctl -u {{ $labels.name }} on the node."
      - alert: ServiceRestartLoop
        # Counts systemd's automatic restarts (Restart=on-failure), including the ones after
        # HealthOnFailure=kill; a manual restart doesn't count. Once StartLimitBurst stops the
        # restarts, SystemdUnitFailed takes over.
        expr: increase(node_systemd_service_restart_total[1h]) > 3
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/rYdddlPWk?var-node={{ $labels.instance }}"
          summary: "{{ $labels.name }} on {{ $labels.host }} restarted {{ $value | printf \"%.0f\" }} times in 1h"
          description: "A crash or a failed health check. journalctl -u {{ $labels.name }} on the node."
      - alert: ClockSkew
        expr: abs(node_timex_offset_seconds) > 0.5 or node_timex_sync_status == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/rYdddlPWk?var-node={{ $labels.instance }}"
          summary: "{{ $labels.host }} clock is off or unsynced"
          description: "TOTP, TLS and the SSH certs all need the clocks within seconds. timedatectl on the node."

  # vm_watchdog on pve1 and pve2 (src/base/vm_watchdog/vm_watchdog.py)
  - name: vm_watchdog
    rules:
      - alert: VMWatchdogReset
        expr: increase(homelab_vm_watchdog_resets_total[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} on {{ $labels.host }} froze and was reset"
          description: "Its agent went silent and it stopped all network and disk I/O. journalctl -u vm_watchdog on the host; the guest's journal from before the reset."
      - alert: VMWatchdogGaveUp
        expr: homelab_vm_watchdog_gave_up == 1
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} on {{ $labels.host }} keeps freezing; vm_watchdog stopped resetting it"
          description: "Reset 3 times in 6 hours and frozen again. It stays as it is until its agent answers or vm_watchdog restarts."
      - alert: VMAgentDown
        # A VM whose agent never answered since it started is never reset, and a busy one
        # only after an hour
        expr: homelab_vm_watchdog_agent_up == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }}'s guest agent on {{ $labels.host }} hasn't answered in 30 minutes"
          description: "vm_watchdog can't tell if it froze. Is qemu-guest-agent installed and running in the guest? qm guest cmd VMID ping on the host."
      - alert: VMWatchdogOnHold
        expr: homelab_vm_watchdog_on_hold == 1
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "vm_watchdog on {{ $labels.host }} has been on hold for 6 hours"
          description: "A long pause_vm_watchdog, a stuck apt or dpkg, or a backup still running. journalctl -u vm_watchdog says why; resume_vm_watchdog ends a pause."
      - alert: VMWatchdogStale
        expr: time() - homelab_vm_watchdog_last_check_timestamp_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "vm_watchdog on {{ $labels.host }} hasn't completed a check in 10 minutes"
          description: "Stopped, or every check fails (pvesh). Use pause_vm_watchdog rather than stopping it for maintenance. journalctl -u vm_watchdog."

  - name: scrapes
    rules:
      - alert: TargetDown
        # Hosts have NodeDown, VictoriaMetrics components ServiceDown (health.yml), CrowdSec
        # and HAProxy their own (crowdsec.yml, vps.yml).
        # nvidia_gpu_desktops: devtop and gaming are off most of the time.
        expr: up{job!~"node_exporter.*|victoriametrics|vmagent|vmalert|crowdsec|crowdsec_appsec|haproxy|nvidia_gpu_desktops"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target {{ $labels.job }} on {{ $labels.host }} is down"

  - name: traefik
    rules:
      - alert: Traefik5xxRate
        expr: sum by (host, service) (rate(traefik_service_requests_total{code=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: error
        annotations:
          dashboard: "{{ $externalURL }}/d/traefik?var-host={{ $labels.host }}&var-service={{ $labels.service }}"
          summary: "{{ $labels.service }} on {{ $labels.host }} returns {{ $value | printf \"%.1f\" }} 5xx/s"
          description: "The access log on the Traefik dashboard has the paths; a 502/504 means the container behind it."
      - alert: TraefikCertExpiry
        # Every cert Traefik holds, including subdomains Gatus doesn't check.
        expr: traefik_tls_certs_not_after - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Traefik on {{ $labels.host }} holds a cert for {{ $labels.cn }} expiring in {{ $value | humanizeDuration }}"
          description: "ACME renews at 30 days; check podman logs traefik for the challenge failure."

  - name: auth
    rules:
      - alert: AuthFailureBurst
        # authelia_authn counts first-factor attempts, labelled success and banned.
        expr: sum(increase(authelia_authn{success="false"}[10m])) > 20
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} failed logins in 10 minutes"
          description: "Authelia's regulation bans after a few failures per user; a burst across users is a scan. Check the authelia log for the source IPs."

  - name: uptime
    # Gatus is the second path: HTTPS checks that don't depend on the scrape pipeline.
    rules:
      - alert: EndpointDown
        # Not for websvcs while pve2 is off: it's powered on when needed, and its collector
        # scrapes pve2, so the series is absent rather than 0.
        expr: |
          gatus_results_endpoint_success == 0
            unless on (host) label_replace(absent(up{job="node_exporter_pve", host="pve2"}), "host", "websvcs", "", "")
        for: 15m
        labels:
          severity: error
        annotations:
          dashboard: "{{ $externalURL }}/d/KPI7Qj1Wk"
          summary: "{{ $labels.name }} has been failing its uptime check for 15 minutes"
          description: "Group {{ $labels.group }}; the history is on the Gatus page (uptime subdomain)."
      - alert: CertExpiringSoon
        # Gatus reports this for every TLS endpoint it checks. ACME renews at 30 days
        # out, so 14 days means renewal has been failing for over two weeks.
        expr: gatus_results_certificate_expiration_seconds < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} certificate expires in {{ $value | humanizeDuration }}"
      - alert: CertExpiringCritical
        expr: gatus_results_certificate_expiration_seconds < 3 * 86400
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} certificate expires in {{ $value | humanizeDuration }}"

  - name: image_updater
    # From the textfile metrics the image updater writes. Age, not absent():
    # a powered-off websvcs has no series, so it doesn't alert. One that boots after days
    # off catches up within half an hour (Persistent=true), inside the `for`.
    rules:
      - alert: ImageUpdaterStale
        expr: time() - image_updater_last_success_timestamp_seconds > 36 * 3600
        for: 1h
        labels:
          severity: error
        annotations:
          summary: "{{ $labels.host }}'s image updater hasn't finished cleanly in {{ $value | humanizeDuration }}"
          description: "Its containers aren't getting updates or CVE fixes. See journalctl -u image_updater, and systemctl list-timers image_updater.timer."
...
