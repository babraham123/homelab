# /etc/opt/vmagent/prometheus.yml
# Ref: https://prometheus.io/docs/prometheus/latest/configuration/configuration
# Every target carries a `host` label (the node, no port): ntfy-alertmanager tags pushes
# by it, and it stays the same for every job on a node.
---
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'vmagent'
    static_configs:
      - targets: ['metric-collector.janedoe.com:8429']
    metrics_path: /metrics
    relabel_configs: &host
      - target_label: host
        replacement: websvcs
  - job_name: 'fluentbit'
    static_configs:
      - targets: ['log-collector.janedoe.com:2020']
    metrics_path: /api/v1/metrics/prometheus
    relabel_configs: *host
#   - job_name: 'finance_exporter'
#     static_configs:
#       - targets: ['finance-exporter.janedoe.com:8002']
#     metrics_path: /
#     relabel_configs: *host
  - job_name: 'traefik'
    static_configs:
      - targets: ['10.11.0.6:8082']
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: webproxy.janedoe.com
      - target_label: host
        replacement: websvcs
  - job_name: 'node_exporter'
    static_configs:
      - targets:
          - host.containers.internal:9100
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: websvcs.janedoe.com:9100
      - target_label: host
        replacement: websvcs
  - job_name: 'node_exporter_pve'
    static_configs:
      - targets: ['pve2.janedoe.com:9100']
    metrics_path: /metrics
    relabel_configs:
      - target_label: host
        replacement: pve2
  # pve2's GPUs are passed through, so their exporters run in the VMs holding them:
  # the Tesla P4 in websvcs, the RTX 3060 Ti in devtop or gaming.
  - job_name: 'nvidia_gpu'
    static_configs:
      - targets: ['host.containers.internal:9835']
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: websvcs.janedoe.com:9835
      - target_label: host
        replacement: websvcs
  # devtop and gaming share the 3060 Ti and rarely run at once, so one of these is
  # usually down; homelab.yml's TargetDown skips this job.
  - job_name: 'nvidia_gpu_desktops'
    static_configs:
      - targets: ['devtop.janedoe.com:9835']
        labels: {host: devtop}
      - targets: ['gaming.janedoe.com:9835']
        labels: {host: gaming}
    metrics_path: /metrics
...
