# websvcs's part of the node inventory; src/nodes.jinja documents the keys.
# yamllint disable rule:document-start rule:document-end
# websvcs is the default route, so its subdomains need no DNS or SNI entries; they
# only name the uptime URLs.
debian_services: [mdns_repeater, node_exporter, nvidia_gpu_exporter, image_updater]
services:
  traefik: {subdomain: webproxy, uptime: traefik websvcs, uptime_tier: 1,
            upstream: docker.io/library/traefik:v3.7}
  vmagent: {upstream: docker.io/victoriametrics/vmagent:latest, dirs: [services/victoriametrics]}
  nginx: {subdomain: www, upstream: docker.io/library/nginx:stable}
  homepage: {subdomain: dash, uptime: homepage, uptime_tier: 1,
             upstream: ghcr.io/gethomepage/homepage:latest}
  isso: {subdomain: comment, upstream: ghcr.io/isso-comments/isso:release}
  guacamole: {subdomain: remote, uptime: guacamole, upstream: docker.io/guacamole/guacamole:1.6.0}
  guacd: {upstream: docker.io/guacamole/guacd:1.6.0, dirs: [services/guacamole]}
  fluentbit: {upstream: docker.io/fluent/fluent-bit:3.2}
  snapraid: {}
  # These need the media array mounted.
  linkding: {subdomain: archive, uptime: linkding, uptime_path: /health,
             upstream: docker.io/sissbruecker/linkding:latest-plus}
  readeck: {subdomain: read, uptime: readeck, uptime_path: /api/info,
            upstream: codeberg.org/readeck/readeck:latest}
  linkding_handoff: {}
  storyteller: {subdomain: books, uptime: storyteller, uptime_path: /api/health,
                upstream: registry.gitlab.com/storyteller-platform/storyteller:web-v2}
  calliope: {build: calliope}
  readeck_narrate: {}
install_all_svcs: true
commands:
  - {name: install_keys, script: nodes/websvcs/commands.sh, key_ids: [pve1]}
  - {name: install_certs, script: nodes/websvcs/commands.sh, key_ids: [pve1]}
  - {name: backup, run: [sudo /root/homelab-rendered/src/nodes/websvcs/backup.sh], key_ids: [pve1]}
  - {name: install_ssh_ca, script: base/debian/commands.sh, key_ids: [pve1]}
  - {name: host_key, run: [cat /etc/ssh/ssh_host_ed25519_key.pub]}
  - {name: install_dispatcher, script: base/debian/commands.sh}
  - {name: install_ca, script: base/debian/commands.sh, key_ids: [pve1]}
  - {name: copy_acme_certs, script: base/debian/commands.sh, key_ids: [pve1]}
