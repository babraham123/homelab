# /etc/opt/traefik/config/dynamic/acme_routes.yml
# Ref: https://doc.traefik.io/traefik/reference/dynamic-configuration/file/
# yamllint disable rule:document-start rule:document-end
http:
  routers:
    pve1: &acme_service
      rule: Host(`pve1.janedoe.com`)
      entryPoints: websecure
      # nginx answers /403 with the styled 403 page, whatever the Host
      service: nginx@file
      middlewares:
        - s403-path@file
      tls:
        options: intermediate@file
        certResolver: le-http-production
    pve2:
      <<: *acme_service
      rule: Host(`pve2.janedoe.com`)
    pbs2:
      <<: *acme_service
      rule: Host(`pbs2.janedoe.com`)
    router:
      <<: *acme_service
      rule: Host(`router.janedoe.com`)
  middlewares:
    s403-path:
      replacePath:
        path: /403
