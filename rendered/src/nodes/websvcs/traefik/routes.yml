# /etc/opt/traefik/config/dynamic/routes.yml
# References:
#   - https://www.simplecto.com/use-traefik-with-nginx-apache-caddyserver-serve-static-files/
#   - https://doc.traefik.io/traefik/reference/dynamic-configuration/file/
# yamllint disable rule:document-start rule:document-end
http:
  routers:
    traefik: &service
      rule: Host(`webproxy.janedoe.com`)
      entryPoints: websecure
      service: api@internal
      middlewares:
        - authelia@file
        - secure-headers@file
      tls:
        options: intermediate@file
        certResolver: le-http-production
    root:
      <<: *service
      rule: Host(`janedoe.com`)
      service: nginx@file
      middlewares:
        - www-redirect@file
    homepage:
      <<: *service
      rule: Host(`dash.janedoe.com`)
      service: homepage@file
    # Public: the blog's visitors read and post comments here
    isso:
      <<: *service
      rule: Host(`comment.janedoe.com`)
      service: isso@file
      middlewares:
        - secure-headers@file
    # Authelia, then isso's admin password
    isso-admin:
      <<: *service
      rule: Host(`comment.janedoe.com`) && PathPrefix(`/admin`)
      service: isso@file
    linkding:
      <<: *service
      rule: Host(`archive.janedoe.com`)
      service: linkding@file
    readeck:
      <<: *service
      rule: Host(`read.janedoe.com`)
      service: readeck@file
    storyteller:
      <<: *service
      rule: Host(`books.janedoe.com`)
      service: storyteller@file
    # Public, since websvcs is HAProxy's catch-all backend: keep authelia@file on every
    # router for this host, and no Authelia bypass rule for it.
    copyparty:
      <<: *service
      rule: Host(`files.janedoe.com`)
      service: copyparty@file
      middlewares:
        - authelia@file
        - no-buffering@file
        - secure-headers@file
    static-files:
      <<: *service
      rule: Host(`www.janedoe.com`) || Host(`wifi.janedoe.com`)
      service: nginx@file
      middlewares:
        - gzip@file
        - secure-headers@file
    # example-static:
    #   <<: *service
    #   rule: (Host(`example.janedoe.com`) && PathPrefix(`/static`))
    #   service: nginx@file
    #   middlewares:
    #     - gzip@file
    #     - static-strip-prefix@file
  services:
    homepage:
      loadBalancer:
        servers:
          - url: http://dash.janedoe.com:3000/
    isso:
      loadBalancer:
        servers:
          - url: http://comment.janedoe.com:8080/
    linkding:
      loadBalancer:
        servers:
          - url: http://archive.janedoe.com:9090/
    readeck:
      loadBalancer:
        servers:
          - url: http://read.janedoe.com:8000/
    storyteller:
      loadBalancer:
        servers:
          - url: http://books.janedoe.com:8001/
    copyparty:
      loadBalancer:
        servers:
          - url: http://files.janedoe.com:3923/
    nginx:
      loadBalancer:
        servers:
          - url: http://static.janedoe.com:8100/
