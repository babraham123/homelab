# /etc/opt/victoriametrics/prometheus.yml
# Ref: https://prometheus.io/docs/prometheus/latest/configuration/configuration
# Every target carries a `host` label (the node, no port): ntfy-alertmanager tags pushes
# by it, and it stays the same for every job on a node, except Gatus's endpoint series.
---
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'authelia'
    static_configs:
      - targets: ['auth.janedoe.com:9959']
    metrics_path: /metrics
    relabel_configs: &host
      - target_label: host
        replacement: secsvcs
  - job_name: 'vmalert'
    static_configs:
      - targets: ['vmalert.janedoe.com:8880']
    metrics_path: /metrics
    relabel_configs: *host
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['metrics.janedoe.com:8428']
    basic_auth:
      username: 'admin'
      password: '%{VM_ADMIN_PASSWORD}'
    metrics_path: /metrics
    relabel_configs: *host
  - job_name: 'victorialogs'
    static_configs:
      - targets: ['logs.janedoe.com:9428']
    basic_auth:
      username: 'admin'
      password: '%{VL_ADMIN_PASSWORD}'
    metrics_path: /metrics
    relabel_configs: *host
  - job_name: 'fluentbit'
    static_configs:
      - targets: ['log-collector.janedoe.com:2020']
    metrics_path: /api/v1/metrics/prometheus
    relabel_configs: *host
  - job_name: gatus
    # https://github.com/TwiN/gatus?tab=readme-ov-file#metrics
    static_configs:
      - targets: ['uptime.janedoe.com:8080']
    metrics_path: /metrics
    relabel_configs: *host
    # Each endpoint's host is the node serving it, not the one running Gatus. Matched by
    # name, not group: the group is part of the key Gatus stores the history under.
    metric_relabel_configs:
      - source_labels: [name]
        regex: 'zigbee2mqtt|home assistant'
        target_label: host
        replacement: homesvcs
      - source_labels: [name]
        regex: 'authelia|victoriametrics|victorialogs|alertmanager|vmalert|ntfy health check|grafana|vaultwarden|ntfy-idp-push|olive_tin'
        target_label: host
        replacement: secsvcs
      - source_labels: [name]
        regex: 'homepage|copyparty|linkding|readeck|storyteller'
        target_label: host
        replacement: websvcs
  - job_name: 'crowdsec'
    # Engine and LAPI; cs_lapi_bouncer_requests_total shows each bouncer's pulls
    static_configs:
      - targets: ['crowdsec.janedoe.com:6060']
    metrics_path: /metrics
    relabel_configs: *host
  - job_name: 'crowdsec_appsec'
    # The node's WAF: requests inspected and blocked
    static_configs:
      - targets: ['appsec.janedoe.com:6060']
    metrics_path: /metrics
    relabel_configs: *host
  - job_name: 'ntfy'
    static_configs:
      - targets: ['push.janedoe.com:2587']
    metrics_path: /metrics
    relabel_configs: *host
  - job_name: 'traefik'
    static_configs:
      - targets: ['10.10.0.6:8082']
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: secproxy.janedoe.com
      - target_label: host
        replacement: secsvcs
  - job_name: 'node_exporter'
    static_configs:
      - targets:
          - host.containers.internal:9100
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: secsvcs.janedoe.com:9100
      - target_label: host
        replacement: secsvcs
  - job_name: 'node_exporter_pve'
    static_configs:
      - targets: ['pve1.janedoe.com:9100']
    metrics_path: /metrics
    relabel_configs:
      - target_label: host
        replacement: pve1
...
