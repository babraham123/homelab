# /etc/opt/traefik/config/dynamic/routes.yml
# References:
#   - https://www.authelia.com/integration/proxies/traefik/
#   - https://www.simplecto.com/use-traefik-with-nginx-apache-caddyserver-serve-static-files/
#   - https://doc.traefik.io/traefik/reference/dynamic-configuration/file/
#   - https://doc.traefik.io/traefik/routing/routers/#priority
#   - https://doc.traefik.io/traefik/reference/routing-configuration/http/routing/multi-layer-routing/
# yamllint disable rule:document-start rule:document-end
http:
  routers:
    traefik: &service
      rule: Host(`secproxy.janedoe.com`)
      entryPoints: websecure
      service: api@internal
      middlewares:
        - authelia@file
        - secure-headers@file
      tls:
        options: intermediate@file
        certResolver: le-http-production
    authelia:
      <<: *service
      rule: Host(`auth.janedoe.com`)
      service: authelia@file
      middlewares:
        - secure-headers@file
    lldap:
      <<: *service
      rule: Host(`ldap.janedoe.com`)
      service: lldap@file
    gatus:
      <<: *service
      rule: Host(`uptime.janedoe.com`)
      service: gatus@file
    grafana:
      <<: *service
      rule: Host(`graph.janedoe.com`)
      service: grafana@file
    victoriametrics-ui:
      rule: Host(`metrics.janedoe.com`) && HeaderRegexp(`User-Agent`, `^Mozilla\/.*`)
      entryPoints: websecure
      middlewares:
        - authelia@file
        - secure-headers@file
      tls:
        options: intermediate@file
        certResolver: le-http-production
    victoriametrics-ui-telemetry:
      parentRefs: [victoriametrics-ui]
      # Authelia joins groups with a bare comma
      rule: HeaderRegexp(`Remote-Groups`, `(^|,)telemetry_access(,|$)`)
      service: victoriametrics@file
      middlewares:
        - vm-auth@file
    victoriametrics-ui-denied:
      parentRefs: [victoriametrics-ui]
      rule: PathPrefix(`/`)
      priority: 1
      service: s403@file
    victoriametrics-hass-api:
      <<: *service
      rule: Host(`metrics.janedoe.com`) && HeaderRegexp(`Authorization`, `^Token .+$`)
      service: victoriametrics@file
      middlewares:
        - "vm-auth-token@file"
    victoriametrics-api:
      <<: *service
      rule: Host(`metrics.janedoe.com`)
      service: victoriametrics@file
      middlewares: []
    victorialogs-ui:
      rule: Host(`logs.janedoe.com`) && HeaderRegexp(`User-Agent`, `^Mozilla\/.*`)
      entryPoints: websecure
      middlewares:
        - authelia@file
        - secure-headers@file
      tls:
        options: intermediate@file
        certResolver: le-http-production
    victorialogs-ui-telemetry:
      parentRefs: [victorialogs-ui]
      # Authelia joins groups with a bare comma
      rule: HeaderRegexp(`Remote-Groups`, `(^|,)telemetry_access(,|$)`)
      service: victorialogs@file
      middlewares:
        - vl-auth@file
    victorialogs-ui-denied:
      parentRefs: [victorialogs-ui]
      rule: PathPrefix(`/`)
      priority: 1
      service: s403@file
    victorialogs-api:
      <<: *service
      rule: Host(`logs.janedoe.com`)
      service: victorialogs@file
      middlewares: []
    vmalert:
      <<: *service
      rule: Host(`vmalert.janedoe.com`)
      service: vmalert@file
    alertmanager-ui:
      rule: Host(`alert.janedoe.com`) && HeaderRegexp(`User-Agent`, `^Mozilla\/.*`)
      entryPoints: websecure
      middlewares:
        - authelia@file
        - secure-headers@file
      tls:
        options: intermediate@file
        certResolver: le-http-production
    alertmanager-ui-telemetry:
      parentRefs: [alertmanager-ui]
      # Authelia joins groups with a bare comma
      rule: HeaderRegexp(`Remote-Groups`, `(^|,)telemetry_access(,|$)`)
      service: alertmanager@file
      middlewares:
        - alertmanager-auth@file
    alertmanager-ui-denied:
      parentRefs: [alertmanager-ui]
      rule: PathPrefix(`/`)
      priority: 1
      service: s403@file
    alertmanager-api:
      <<: *service
      rule: Host(`alert.janedoe.com`)
      service: alertmanager@file
      middlewares: []
    # Browser navigations only, where Authelia's redirect works. The web app signs in to ntfy
    # itself, so its fetch, WebSocket and service-worker requests go to ntfy-api with their own
    # credentials. The redeem page carries its code in the fragment, which Authelia's post-login
    # redirect would drop.
    ntfy-ui:
      <<: *service
      rule: Host(`push.janedoe.com`) && Method(`GET`) && Header(`Sec-Fetch-Mode`, `navigate`) && !PathPrefix(`/file/`) && !Path(`/account/token/redeem`)
      service: ntfy@file
    # The signed-in web app sends its token as ?auth= on the WebSocket URL
    ntfy-ws:
      <<: *service
      rule: Host(`push.janedoe.com`) && PathRegexp(`^/[-_A-Za-z0-9,]+/ws$`)
      service: ntfy@file
      middlewares: []
      observability:
        accessLogs: false
    ntfy-api:
      <<: *service
      rule: Host(`push.janedoe.com`)
      service: ntfy@file
      middlewares: []
    ntfy-alertmanager:
      <<: *service
      rule: Host(`ntfy-alertmanager.janedoe.com`)
      service: ntfy-alertmanager@file
      middlewares: []
    # Clients call the API directly, so no Authelia. No secure-headers either: it would replace
    # Vaultwarden's own CSP and X-Frame-Options, and add them to the connector pages the
    # extension frames for WebAuthn and Duo.
    vaultwarden:
      <<: *service
      rule: Host(`vault.janedoe.com`)
      service: vaultwarden@file
      middlewares: []
    # The websocket URL carries ?access_token=<JWT>, and Traefik can't redact a query
    # parameter, so keep these requests out of the access log (and the journal) entirely.
    vaultwarden-notifications:
      <<: *service
      rule: Host(`vault.janedoe.com`) && PathPrefix(`/notifications/`)
      service: vaultwarden@file
      middlewares: []
      observability:
        accessLogs: false
    # Authelia, then Vaultwarden's admin token
    vaultwarden-admin:
      <<: *service
      rule: Host(`vault.janedoe.com`) && PathPrefix(`/admin`)
      service: vaultwarden@file
      middlewares:
        - authelia@file
    # The enrollment and device pages trust Remote-User, so they sit behind Authelia (two_factor:
    # admin in the inventory). The routes below check their own signature, passkey, code or token
    # and must not reach Authelia: Duo's Authorization: Basic would count as a failed login.
    # strip-remote keeps a client-sent Remote-User off them. No secure-headers: the shim sets a
    # stricter CSP, HSTS and nosniff itself.
    ntfy_idp_push:
      <<: *service
      rule: Host(`idp-push.janedoe.com`)
      service: ntfy_idp_push@file
      middlewares:
        - authelia@file
    ntfy_idp_push-api:
      <<: *service
      rule: Host(`idp-push.janedoe.com`) && (PathPrefix(`/auth/v2/`) || PathPrefix(`/challenge/`) || PathPrefix(`/static/`) || PathPrefix(`/subscribe/`) || PathPrefix(`/token/`))
      service: ntfy_idp_push@file
      middlewares:
        - strip-remote@file
    olive_tin:
      <<: *service
      rule: Host(`command.janedoe.com`)
      service: olive_tin@file
  services:
    authelia:
      loadBalancer:
        servers:
          - url: https://auth.janedoe.com:9091/
        serversTransport: autheliaMutualTLS
    lldap:
      loadBalancer:
        servers:
          - url: http://ldap.janedoe.com:17170/
    gatus:
      loadBalancer:
        servers:
          - url: http://uptime.janedoe.com:8080/
    grafana:
      loadBalancer:
        servers:
          - url: http://graph.janedoe.com:3000/
    victoriametrics:
      loadBalancer:
        servers:
          - url: http://metrics.janedoe.com:8428/
    victorialogs:
      loadBalancer:
        servers:
          - url: http://logs.janedoe.com:9428/
    vmalert:
      loadBalancer:
        servers:
          - url: http://vmalert.janedoe.com:8880/
    alertmanager:
      loadBalancer:
        servers:
          - url: http://alert.janedoe.com:9093/
    ntfy:
      loadBalancer:
        servers:
          - url: http://push.janedoe.com:2586/
    ntfy-alertmanager:
      loadBalancer:
        servers:
          - url: http://ntfy-alertmanager.janedoe.com:2588/
    vaultwarden:
      loadBalancer:
        servers:
          - url: http://vault.janedoe.com:8080/
    ntfy_idp_push:
      loadBalancer:
        servers:
          - url: http://idp-push.janedoe.com:8080/
    olive_tin:
      loadBalancer:
        servers:
          - url: http://command.janedoe.com:1337/
    s403:
      loadBalancer:
        servers:
          - url: https://www.janedoe.com/error/403.html
