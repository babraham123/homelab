# pve2's part of the node inventory; src/nodes.jinja documents the keys.
# yamllint disable rule:document-start rule:document-end
debian_services: [vm_watchdog]
commands:
  - {name: install_certs_and_keys, script: nodes/pve2/commands.sh, key_ids: [pve1]}
  - {name: start_gaming_vm, script: nodes/pve2/commands.sh}
  - {name: stop_gaming_vm, script: nodes/pve2/commands.sh}
  - {name: install_hookscript, script: nodes/pve2/commands.sh}
  - {name: backup, run: [sudo /root/homelab-rendered/src/nodes/pve2/backup.sh], key_ids: [pve1]}
  - {name: prune, run: [sudo /root/homelab-rendered/src/nodes/pve2/prune.sh]}
  - {name: shutdown, run: [sudo /usr/sbin/shutdown -h now]}
  - {name: install_ssh_ca, script: base/debian/commands.sh, key_ids: [pve1]}
  - {name: host_key, run: [cat /etc/ssh/ssh_host_ed25519_key.pub]}
  - {name: install_dispatcher, script: base/debian/commands.sh}
  - {name: install_ca, script: base/debian/commands.sh, key_ids: [pve1]}
