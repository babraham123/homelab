# /etc/opt/vmagent/prometheus.yml
# Ref: https://prometheus.io/docs/prometheus/latest/configuration/configuration
# Every target carries a `host` label (the node, no port): ntfy-alertmanager tags pushes
# by it, and it stays the same for every job on a node.
---
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'vmagent'
    static_configs:
      - targets: ['metric-collector.janedoe.com:8429']
    metrics_path: /metrics
    relabel_configs: &host
      - target_label: host
        replacement: homesvcs
  - job_name: 'fluentbit'
    static_configs:
      - targets: ['log-collector.janedoe.com:2020']
    metrics_path: /api/v1/metrics/prometheus
    relabel_configs: *host
  - job_name: 'crowdsec_appsec'
    # The node's WAF: requests inspected and blocked
    static_configs:
      - targets: ['appsec.janedoe.com:6060']
    metrics_path: /metrics
    relabel_configs: *host
  - job_name: 'traefik'
    static_configs:
      - targets: ['10.12.0.6:8082']
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: homeproxy.janedoe.com
      - target_label: host
        replacement: homesvcs
  - job_name: 'node_exporter'
    static_configs:
      - targets:
          - host.containers.internal:9100
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: homesvcs.janedoe.com:9100
      - target_label: host
        replacement: homesvcs
...
