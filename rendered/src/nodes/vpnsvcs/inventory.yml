# vpnsvcs's part of the node inventory; tools/inventory.py documents the keys.
# yamllint disable rule:document-start rule:document-end
debian_services: [node_exporter, image_updater, iperf3_server]
services:
  fail2ban: {}
  headscale: {}
  tailscaled: {}
  haproxy: {}
  crowdsec_firewall_bouncer:
    dirs: [services/crowdsec]
  deadman: {}
  # Quadlets on the podman network (docs/adr/0007-vps-metrics-pushed.md)
  fluentbit:
    shared: true
    ip: 20
    upstream: docker.io/fluent/fluent-bit:5.1
  vmagent:
    shared: true
    ip: 7
    upstream: docker.io/victoriametrics/vmagent:latest
    dirs: [services/victoriametrics]
  geoip_generator:
    ip: 30
    build: geoip_generator
# Not headscale and tailscaled: each pulls its package again and restarts the control plane
# or the tunnel every home service is reached through.
install_some_svcs: [node_exporter, image_updater, iperf3_server, fail2ban, haproxy, crowdsec_firewall_bouncer, deadman,
                    fluentbit, vmagent, geoip_generator]
# node_exporter, HAProxy's exporter, Headscale and the firewall bouncer, for vmagent
open_ports: {8405: [vmagent], 9090: [vmagent], 9100: [vmagent], 60601: [vmagent]}
image_updater_slot: '20:00'
# No jars in its images, and the ~1 GB Java DB is a lot for the VPS's disk
image_updater_java_db: false
commands:
  - name: backup
    run: [sudo /root/homelab-rendered/src/nodes/vpnsvcs/backup.sh]
    pve1_file_transfer: true
  - name: install_ssh_ca
    script: base/debian/commands.sh
    pve1_file_transfer: true
  - name: host_key
    run: [cat /etc/ssh/ssh_host_ed25519_key.pub]
  - name: install_dispatcher
    script: base/debian/commands.sh
  - name: install_ca
    script: base/debian/commands.sh
    pve1_file_transfer: true
  - name: failed_units
    script: base/debian/commands.sh
  - name: update_images
    script: base/debian/commands.sh
  - name: reboot
    script: base/debian/commands.sh
  - name: upgrade
    script: base/debian/commands.sh
