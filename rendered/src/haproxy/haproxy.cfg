# /etc/haproxy/haproxy.cfg
# Ref: https://www.haproxy.org/download/2.6/doc/configuration.txt
# Ref: https://www.haproxy.com/blog/the-four-essential-sections-of-an-haproxy-configuration
global
    log /dev/log local0 info
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # Default SSL material locations
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

    # https://ssl-config.mozilla.org/#server=haproxy&version=2.6.12&config=intermediate&openssl=3.0.11&guideline=5.7
    # intermediate configuration
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options prefer-client-ciphers no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets

    ssl-default-server-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
    ssl-default-server-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-server-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets

    # curl https://ssl-config.mozilla.org/ffdhe2048.txt > /etc/haproxy/dhparam
    ssl-dh-param-file /etc/haproxy/dhparam

defaults
    log global
    option dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    # Only applies to http traffic. https must be handled on termination in traefik
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Custom configs
# Docs: https://cbonte.github.io/haproxy-dconv/configuration-1.5.html
frontend https_all
    mode tcp
    bind *:443

    # Wait for a client hello for at most 5 seconds. Also delays silent-drop
    tcp-request inspect-delay 5s

    # Rate limiting for HTTPS connections
    stick-table type ip size 100k expire 30s store conn_rate(3s),conn_cur
    tcp-request connection track-sc0 src
    # Limit concurrent connections, connection rate
    tcp-request content silent-drop if { src_conn_cur(https_all) gt 30 }
    tcp-request content silent-drop if { src_conn_rate(https_all) gt 50 }

    # Reject blocked countries

    acl RU src,map_ip(/etc/haproxy/countries/RU.map) -m found
    acl CN src,map_ip(/etc/haproxy/countries/CN.map) -m found
    tcp-request content silent-drop if RU || CN

    tcp-request content accept if { req.ssl_hello_type 1 }

    acl vpn_host req.ssl_sni -i vpn.janedoe.com
    use_backend local_https_vpn if vpn_host


    acl alert req.ssl_sni -i alert.janedoe.com
    acl auth req.ssl_sni -i auth.janedoe.com
    acl command req.ssl_sni -i command.janedoe.com
    acl graph req.ssl_sni -i graph.janedoe.com
    acl ldap req.ssl_sni -i ldap.janedoe.com
    acl logs req.ssl_sni -i logs.janedoe.com
    acl metrics req.ssl_sni -i metrics.janedoe.com
    acl ntfy-alertmanager req.ssl_sni -i ntfy-alertmanager.janedoe.com
    acl push req.ssl_sni -i push.janedoe.com
    acl secproxy req.ssl_sni -i secproxy.janedoe.com
    acl uptime req.ssl_sni -i uptime.janedoe.com
    acl vmalert req.ssl_sni -i vmalert.janedoe.com
    use_backend secsvcs_https_proxy if alert || auth || command || graph || ldap || logs || metrics || ntfy-alertmanager || push || secproxy || uptime || vmalert


    acl home req.ssl_sni -i home.janedoe.com
    acl homeproxy req.ssl_sni -i homeproxy.janedoe.com
    acl iot req.ssl_sni -i iot.janedoe.com
    acl zigbee req.ssl_sni -i zigbee.janedoe.com
    use_backend homesvcs_https_proxy if home || homeproxy || iot || zigbee

    # Let the remaining subdomains fall thru for ACME
    acl tld req.ssl_sni -i janedoe.com
    acl any_subdomain req.ssl_sni -i -m end .janedoe.com
    use_backend websvcs_https_proxy if tld || any_subdomain

    default_backend silent_drop_https

frontend http_all
    mode http
    bind *:80

    timeout tarpit 5s

    # Reject blocked countries

    acl RU src,map_ip(/etc/haproxy/countries/RU.map) -m found
    acl CN src,map_ip(/etc/haproxy/countries/CN.map) -m found
    http-request silent-drop if RU || CN

    # Block sensitive files and directories
    acl blocked_files path_end -i .env .htaccess .htpasswd .conf .config .cfg .yml .yaml .bak .sql .log .ini .json .old .swp
    acl blocked_dirs path_dir -i .git .aws .kube .docker wp-admin wp-content wp-includes phpmyadmin pma backup admin config
    http-request silent-drop if blocked_files || blocked_dirs

    # Rate limiting tables
    stick-table type ip size 100k expire 30s store http_req_rate(10s),gpc0
    http-request track-sc0 src
    # Define simple conditions
    acl abuse_rate src_http_req_rate(http_all) gt 150
    acl is_flagged src_get_gpc0(http_all) gt 0
    # Flag them if rate is high
    http-request sc-inc-gpc0(0) if abuse_rate
    # Deny if they are flagged (sticky ban) or currently abusing
    http-request silent-drop if is_flagged

    acl vpn_host hdr(host) -i vpn.janedoe.com
    use_backend local_http_vpn if vpn_host


    acl alert hdr(host) -i alert.janedoe.com
    acl auth hdr(host) -i auth.janedoe.com
    acl command hdr(host) -i command.janedoe.com
    acl graph hdr(host) -i graph.janedoe.com
    acl ldap hdr(host) -i ldap.janedoe.com
    acl logs hdr(host) -i logs.janedoe.com
    acl metrics hdr(host) -i metrics.janedoe.com
    acl ntfy-alertmanager hdr(host) -i ntfy-alertmanager.janedoe.com
    acl push hdr(host) -i push.janedoe.com
    acl secproxy hdr(host) -i secproxy.janedoe.com
    acl uptime hdr(host) -i uptime.janedoe.com
    acl vmalert hdr(host) -i vmalert.janedoe.com
    use_backend secsvcs_http_proxy if alert || auth || command || graph || ldap || logs || metrics || ntfy-alertmanager || push || secproxy || uptime || vmalert


    acl home hdr(host) -i home.janedoe.com
    acl homeproxy hdr(host) -i homeproxy.janedoe.com
    acl iot hdr(host) -i iot.janedoe.com
    acl zigbee hdr(host) -i zigbee.janedoe.com
    use_backend homesvcs_http_proxy if home || homeproxy || iot || zigbee

    # Let the remaining subdomains fall thru to websvcs
    acl tld hdr(host) -i janedoe.com
    acl any_subdomain hdr_end(host) -i .janedoe.com
    use_backend websvcs_http_proxy if tld || any_subdomain

    default_backend silent_drop_http

# backends, naming: server_protocol_purpose

backend local_http_vpn
    mode http
    option forwardfor
    server vpn_http 127.0.0.1:8080

backend local_https_vpn
    mode tcp
    server vpn_https 127.0.0.1:8443

backend websvcs_http_proxy
    mode http
    server websvcs_http 192.168.2.20:80 send-proxy-v2

backend websvcs_https_proxy
    mode tcp
    server websvcs_https 192.168.2.20:443 send-proxy-v2

backend secsvcs_http_proxy
    mode http
    server secsvcs_http 192.168.4.20:80 send-proxy-v2

backend secsvcs_https_proxy
    mode tcp
    server secsvcs_https 192.168.4.20:443 send-proxy-v2

backend homesvcs_http_proxy
    mode http
    server homesvcs_http 192.168.4.21:80 send-proxy-v2

backend homesvcs_https_proxy
    mode tcp
    server homesvcs_https 192.168.4.21:443 send-proxy-v2

backend silent_drop_http
    mode http
    timeout tarpit 5s
    http-request silent-drop

backend silent_drop_https
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content silent-drop
