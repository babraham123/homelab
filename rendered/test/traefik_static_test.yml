---
# /etc/opt/traefik/config/static/traefik.yml
global:
  sendAnonymousUsage: false
  checkNewVersion: false
api:
  dashboard: true
  insecure: false
log:
  level: DEBUG
  format: common
providers:
  file:
    watch: true
    directory: /config/dynamic
entryPoints:
  web:
    address: ":80/tcp"
    http:
      aliasHeadersStrategy: delete
    proxyProtocol:
      insecure: false
      trustedIPs: [12.34.56.78]
    forwardedHeaders:
      insecure: false
      trustedIPs: [12.34.56.78]
  websecure:
    address: ":443/tcp"
    http:
      aliasHeadersStrategy: delete
    proxyProtocol:
      insecure: false
      trustedIPs: [12.34.56.78]
    forwardedHeaders:
      insecure: false
      trustedIPs: [12.34.56.78]
...
