# With gaming/ and router/, uses every inventory form src/nodes.jinja derives lists
# from; tests/nodes_jinja_test.sh holds the expected lists. `services` is deliberately
# not in alphabetical order, since key order is install order.
# yamllint disable rule:document-start rule:document-end
debian_services: [node_exporter, mdns_repeater]
services:
  zeta: {subdomain: z, admin: true, uptime: zeta, upstream: docker.io/library/nginx:stable}
  proxy: {shared: true}
  app:
    subdomain: app
    uptime: app health
    uptime_path: /health
    uptime_tier: 1
    uptime_conditions: ['[BODY].status == OK']
    build: app
    update_last: true
  pod:
    containers:
      pod-db: {upstream: ghcr.io/acme/db:16, update_last: true}
      pod-web: {build: pod-web}
  plain: {}
install_all_svcs: true
commands:
  - {name: install_keys, script: nodes/alpha/commands.sh, pve1_file_transfer: true}
  - {name: build_map, script: nodes/alpha/commands.sh, sudo: false}
  - name: check_gpu
    run:
      - sudo /usr/bin/systemctl status nvidia-persistenced --no-pager
      - nvidia-smi
  - {name: backup, run: [sudo /root/homelab-rendered/src/nodes/alpha/backup.sh]}
  - {name: install_ca, script: base/debian/commands.sh}
