# /etc/opt/db/pg_hba.conf
# Ref: https://www.postgresql.org/docs/14/auth-pg-hba-conf.html
# Read through hba_file, so it replaces the one initdb wrote into the data volume.

# TYPE   DATABASE  USER  ADDRESS  METHOD
# The socket is only reachable from inside the container: the entrypoint's init scripts and
# podman exec (init_guacamole_db.sh, the upgrade guide)
local    all       all            trust
# Every network client, so a client that skips TLS is refused instead of sending its password
# in the clear
hostssl  all       all   all      scram-sha-256
