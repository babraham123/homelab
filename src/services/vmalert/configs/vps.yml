# The VPS pushes its metrics from a local vmagent (docs/adr/0007-vps-metrics-pushed.md),
# so when the VPS, its tailnet link or that vmagent is down nothing arrives and
# `up == 0` can't fire: absence is the signal. NodeDown (homelab.yml) still covers
# node_exporter dying while vmagent lives.
---
groups:
  - name: vps
    rules:
      - alert: VpsMetricsAbsent
        expr: absent_over_time(up{job="node_exporter",host="vpnsvcs"}[5m])
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No metrics from the VPS for 10 minutes"
          description: "The VPS, its tailnet link, or its vmagent is down; public ingress is likely off. deadman.timer there can't report this either."
      - alert: HaproxyDown
        expr: up{job="haproxy"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HAProxy on the VPS is not answering its exporter"
          description: "Public ingress is down. systemctl status haproxy on vpnsvcs."
      - alert: HaproxyBackendConnectErrors
        # The backend servers have no health check (one server each, a false DOWN would
        # cut traffic), so an unreachable VM shows as connection errors once traffic hits it.
        # host is the VM behind the proxy; not for websvcs while pve2 is off (see EndpointDown
        # in homelab.yml).
        expr: |
          label_replace(sum by (proxy) (rate(haproxy_backend_connection_errors_total{proxy=~".*svcs_https?_proxy"}[5m])) > 0, "host", "$1", "proxy", "(.*)_https?_proxy")
            unless on (host) label_replace(absent(up{job="node_exporter_pve", host="pve2"}), "host", "websvcs", "", "")
        for: 5m
        labels:
          severity: error
        annotations:
          dashboard: "{{ $externalURL }}/d/haproxy?var-backend={{ $labels.proxy }}"
          summary: "HAProxy can't connect to {{ $labels.proxy }}"
          description: "The VM or its Traefik is down, or the tailnet path from the VPS is broken."
      - alert: VpsTransferHigh
        # Linode bills outbound transfer past the plan's monthly pool. A rolling 30 days
        # stands in for the billing month, and needs retention.metric_days >= 30 to see it all.
        # The pool is a recorded series (plans.yml.j2), so this file stays free of Jinja.
        expr: |
          increase(node_network_transmit_bytes_total{device="eth0",host="vpnsvcs"}[30d])
            / on (host) homelab_vps_transfer_pool_bytes > 0.8
        for: 1h
        labels:
          severity: warning
        annotations:
          dashboard: "{{ $externalURL }}/d/vpnsvcs_bandwidth"
          summary: "The VPS sent {{ $value | humanizePercentage }} of its monthly transfer pool in 30 days"
          description: "The VPS bandwidth dashboard splits it into tailnet and DERP; the bytes-per-SNI LogsQL query in docs/queries.md ranks the public subdomains."
...
