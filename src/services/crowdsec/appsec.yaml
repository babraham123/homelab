# /etc/opt/crowdsec_appsec/config/acquis.d/appsec.yaml
# Ref: https://docs.crowdsec.net/docs/next/log_processor/data_sources/appsec
# Listens for the Traefik plugin on the node's Podman network only: nothing publishes
# the port. appsec-default holds the in-band virtual patches and generic rules; crs is
# out-of-band (crowdsec_appsec.container).
---
source: appsec
listen_addr: 0.0.0.0:7422
appsec_configs:
  - crowdsecurity/appsec-default
  - crowdsecurity/crs
labels:
  type: appsec
...
