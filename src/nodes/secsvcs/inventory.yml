# secsvcs's part of the node inventory; src/nodes.jinja documents the keys.
# yamllint disable rule:document-start rule:document-end
debian_services: [mdns_repeater, node_exporter, image_updater]
services:
  postgres: {upstream: docker.io/library/postgres:14-alpine}
  lldap: {subdomain: ldap, admin: true, upstream: docker.io/lldap/lldap:stable}
  authelia: {subdomain: auth, uptime: authelia, uptime_path: /api/health, uptime_tier: 1,
             uptime_conditions: ['[BODY].status == OK'],
             upstream: docker.io/authelia/authelia:4.39}
  traefik: {subdomain: secproxy, admin: true, uptime: traefik secsvcs, uptime_tier: 1,
            upstream: docker.io/library/traefik:v3.7, update_last: true}
  victoriametrics: {subdomain: metrics, uptime: victoriametrics,
                    upstream: docker.io/victoriametrics/victoria-metrics:latest, update_last: true}
  victorialogs: {subdomain: logs, uptime: victorialogs,
                 upstream: docker.io/victoriametrics/victoria-logs:latest}
  gatus: {subdomain: uptime, upstream: docker.io/twinproduction/gatus:latest}
  vmalert: {subdomain: vmalert, admin: true, uptime: vmalert,
            upstream: docker.io/victoriametrics/vmalert:latest, update_last: true}
  alertmanager: {subdomain: alert, admin: true, uptime: alertmanager,
                 upstream: docker.io/prom/alertmanager:latest, update_last: true}
  ntfy-alertmanager: {subdomain: ntfy-alertmanager, dirs: [services/alertmanager],
                      upstream: docker.io/xenrox/ntfy-alertmanager:latest, update_last: true}
  ntfy: {subdomain: push, uptime: ntfy health check, uptime_path: /v1/health, uptime_tier: 1,
         upstream: docker.io/binwiederhier/ntfy:latest, update_last: true}
  grafana: {subdomain: graph, uptime: grafana, uptime_tier: 1,
            upstream: docker.io/grafana/grafana-oss:latest}
  vaultwarden: {subdomain: vault, admin: true, uptime: vaultwarden, uptime_path: /alive,
                uptime_tier: 1, upstream: docker.io/vaultwarden/server:latest}
  olive_tin: {subdomain: command, admin: true, uptime: olive_tin,
              upstream: docker.io/jamesread/olivetin:latest-3k}
  # No subdomain: its LAPI is a published port, never in HAProxy's SNI list
  crowdsec: {upstream: docker.io/crowdsecurity/crowdsec:latest}
  crowdsec_appsec: {upstream: docker.io/crowdsecurity/crowdsec:latest, dirs: [services/crowdsec]}
  fluentbit: {upstream: docker.io/fluent/fluent-bit:3.2}
install_all_svcs: true
commands:
  - {name: install_keys, script: nodes/secsvcs/commands.sh, pve1_file_transfer: true}
  - {name: install_certs, script: nodes/secsvcs/commands.sh, pve1_file_transfer: true}
  - {name: install_ssh_ca, script: base/debian/commands.sh, pve1_file_transfer: true}
  - {name: host_key, run: [cat /etc/ssh/ssh_host_ed25519_key.pub]}
  - {name: install_dispatcher, script: base/debian/commands.sh}
  - {name: install_olive_tin_cert, script: nodes/secsvcs/commands.sh, pve1_file_transfer: true}
  - {name: install_ca, script: base/debian/commands.sh, pve1_file_transfer: true}
  - {name: copy_acme_certs, script: base/debian/commands.sh, pve1_file_transfer: true}
  - {name: backup, run: [sudo /root/homelab-rendered/src/nodes/secsvcs/backup.sh], pve1_file_transfer: true}
