# /root/secrets/secsvcs.yaml.age
# Ref:
# https://www.authelia.com/reference/guides/generating-secure-values
# https://github.com/lldap/lldap/blob/main/lldap_config.docker_template.toml
# https://docs.podman.io/en/latest/markdown/podman-secret.1.html
---
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&'\''()*+,-./:;<=>?@[\]^_{|}~' </dev/urandom | head -c 32; echo
authelia_jwt_secret: ""
# LC_ALL=C tr -cd '[:alnum:]' < /dev/urandom | head -c 64; echo
authelia_storage_key: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&()*+,-.:;<=>?[]^_{|}~' </dev/urandom | head -c 20; echo
authelia_pg_password: ""
# gmail app passwords
# https://support.google.com/accounts/answer/185833?hl=en
lldap_smtp_password: ""
authelia_smtp_password: ""
alert_smtp_password: ""
# LC_ALL=C tr -cd '[:alnum:]' < /dev/urandom | head -c 64; echo
oidc_hmac_secret: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&'\''()*+,-./:;<=>?@[\]^_{|}~' </dev/urandom | head -c 32; echo
lldap_jwt_secret: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&()*+,-.:;<=>?[]^_{|}~' </dev/urandom | head -c 20; echo
lldap_pg_password: ""
# postgres://lldap:${lldap_pg_password}@pgdb.<site.url>/lldap, the host the cert names
lldap_db_url: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!@#%&*+-=?^_~' </dev/urandom | head -c 20; echo
lldap_admin_password: ""
# Derives LLDAP's server key, which every stored password is bound to: changing it invalidates
# all LLDAP passwords, and LLDAP won't start until forced with LLDAP_FORCE_UPDATE_PRIVATE_KEY=true
# LC_ALL=C tr -cd '[:alnum:]' < /dev/urandom | head -c 64; echo
lldap_key_seed: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&()*+,-.:;<=>?[]^_{|}~' </dev/urandom | head -c 20; echo
postgres_password: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto rand --length 72 --charset rfc3986
hs_oidc_id: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
hs_oidc_secret: ""
hs_oidc_secret_hash: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&()*+,-.:;<=>?[]^_{|}~' </dev/urandom | head -c 20; echo
gatus_pg_password: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto rand --length 72 --charset rfc3986
gatus_oidc_id: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
gatus_oidc_secret: ""
gatus_oidc_secret_hash: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&()*+,-.:;<=>?[]^_{|}~' </dev/urandom | head -c 20; echo
grafana_pg_password: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto rand --length 72 --charset rfc3986
grafana_oidc_id: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
grafana_oidc_secret: ""
grafana_oidc_secret_hash: ""
# sudo podman run --rmi docker.io/binwiederhier/ntfy:latest webpush keys
ntfy_webpush_public_key: ""
ntfy_webpush_private_key: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&()*+,-.:;<=>?[]^_{|}~' </dev/urandom | head -c 20; echo
ntfy_admin_password: ""
ntfy_hass_password: ""
ntfy_alert_password: ""
ntfy_person_password: ""
# sudo podman run --rmi docker.io/binwiederhier/ntfy:latest token generate
ntfy_alert_token: ""
# ntfy admin `idp-push` for ntfy-idp-push; only hashed into auth-users, the shim uses the token
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&()*+,-.:;<=>?[]^_{|}~' </dev/urandom | head -c 20; echo
ntfy_idp_push_password: ""
# sudo podman run --rmi docker.io/binwiederhier/ntfy:latest token generate
ntfy_idp_push_admin_token: ""
# Shared by Authelia's duo_api and ntfy-idp-push. Prints both keys:
# sudo podman run --rm ghcr.io/babraham123/ntfy-idp-push:latest keygen
duo_integration_key: ""
duo_secret_key: ""
# LLDAP user `ntfy_idp_push` in lldap_strict_readonly, ntfy-idp-push's directory bind
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&()*+,-.:;<=>?[]^_{|}~' </dev/urandom | head -c 20; echo
ntfy_idp_push_ldap_password: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&()*+,-.:;<=>?[]^_{|}~' </dev/urandom | head -c 20; echo
alertmanager_admin_password: ""
# LC_ALL=C tr -dc '0-9A-Za-z' </dev/urandom | head -c 22; echo
bcrypt_salt: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&()*+,-.:;<=>?[]^_{|}~' </dev/urandom | head -c 20; echo
ntfy_alertmanager_admin_password: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&*+-<=>?^_~' </dev/urandom | head -c 20; echo
victoriametrics_admin_password: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&*+-<=>?^_~' </dev/urandom | head -c 20; echo
victorialogs_admin_password: ""
# LC_ALL=C tr -dc 'A-Za-z0-9!#%&()*+,-.:;<=>?[]^_{|}~' </dev/urandom | head -c 20; echo
hass_pg_password: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto rand --length 72 --charset rfc3986
hass_oidc_id: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
hass_oidc_secret: ""
hass_oidc_secret_hash: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto rand --length 72 --charset rfc3986
olive_tin_oidc_id: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
olive_tin_oidc_secret: ""
olive_tin_oidc_secret_hash: ""
# Docker Hub >> Account settings >> Personal access tokens, public repo read-only;
# image_updater pulls with it
docker_hub_username: ""
docker_hub_token: ""
# CrowdSec LAPI key for the VPS's firewall bouncer; also /etc/opt/secrets/crowdsec_bouncer_key there
# LC_ALL=C tr -cd '[:alnum:]' < /dev/urandom | head -c 40; echo
crowdsec_bouncer_vpnsvcs: ""
# CrowdSec LAPI keys for each node's Traefik plugin; each also in that node's secrets
# LC_ALL=C tr -cd '[:alnum:]' < /dev/urandom | head -c 40; echo
crowdsec_bouncer_secsvcs: ""
crowdsec_bouncer_homesvcs: ""
crowdsec_bouncer_websvcs: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto rand --length 72 --charset rfc3986
readeck_oidc_id: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
readeck_oidc_secret: ""
readeck_oidc_secret_hash: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto rand --length 72 --charset rfc3986
storyteller_oidc_id: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
storyteller_oidc_secret: ""
storyteller_oidc_secret_hash: ""
# Alphanumeric only: it goes inside vaultwarden_db_url
# LC_ALL=C tr -cd '[:alnum:]' < /dev/urandom | head -c 32; echo
vaultwarden_pg_password: ""
# postgresql://vaultwarden:${vaultwarden_pg_password}@pgdb.<site.url>/vaultwarden, the host the cert names
vaultwarden_db_url: ""
# The raw argon2id PHC string, without the $$ doubling docker-compose needs. The plaintext
# token stays with the maintainer and in the escrow bundle.
# token: openssl rand -base64 48
# sudo podman run --rm -it docker.io/vaultwarden/server:latest /vaultwarden hash --preset owasp
vaultwarden_admin_token_hash: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto rand --length 72 --charset rfc3986
vaultwarden_oidc_id: ""
# sudo podman run --rmi docker.io/authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
vaultwarden_oidc_secret: ""
vaultwarden_oidc_secret_hash: ""
...
