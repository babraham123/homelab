# devtop's part of the node inventory; tools/inventory.py documents the keys.
# yamllint disable rule:document-start rule:document-end
debian_services: [nvidia_gpu_exporter]
commands:
  - name: check_gpu
    run:
      - sudo /usr/bin/systemctl status nvidia-persistenced --no-pager
      - nvidia-smi
  - name: install_ssh_ca
    script: base/debian/commands.sh
    pve1_file_transfer: true
  - name: host_key
    run: [cat /etc/ssh/ssh_host_ed25519_key.pub]
  - name: install_dispatcher
    script: base/debian/commands.sh
  - name: install_ca
    script: base/debian/commands.sh
    pve1_file_transfer: true
