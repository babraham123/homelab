# pve1's part of the node inventory; tools/inventory.py documents the keys.
# yamllint disable rule:document-start rule:document-end
debian_services: [vm_watchdog]
services:
  cert_notifier: {}
  ct_watch: {}
  backup_orchestrator: {}
commands:
  - name: archive_repo
    script: nodes/pve1/commands.sh
  - name: backup_now
    script: nodes/pve1/commands.sh
  - name: skip_next_backup
    script: nodes/pve1/commands.sh
  - name: install_ssh_ca
    script: base/debian/commands.sh
    pve1_file_transfer: true
  - name: host_key
    run: [cat /etc/ssh/ssh_host_ed25519_key.pub]
  - name: install_dispatcher
    script: base/debian/commands.sh
  - name: install_ca
    script: base/debian/commands.sh
    pve1_file_transfer: true
