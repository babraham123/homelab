# vpnsvcs's part of the node inventory; src/nodes.jinja documents the keys.
# yamllint disable rule:document-start rule:document-end
debian_services: [node_exporter, image_updater, iperf3_server]
services:
  fail2ban: {}
  headscale: {}
  tailscaled: {}
  haproxy: {}
  crowdsec_firewall_bouncer: {dirs: [services/crowdsec]}
  deadman: {}
  # Quadlets on the podman network (docs/adr/0007-vps-metrics-pushed.md)
  fluentbit: {upstream: docker.io/fluent/fluent-bit:5.1}
  vmagent: {upstream: docker.io/victoriametrics/vmagent:latest, dirs: [services/victoriametrics]}
  geoip_generator: {build: geoip_generator}
commands:
  - {name: backup, run: [sudo /root/homelab-rendered/src/nodes/vpnsvcs/backup.sh], pve1_file_transfer: true}
  - {name: install_ssh_ca, script: base/debian/commands.sh, pve1_file_transfer: true}
  - {name: host_key, run: [cat /etc/ssh/ssh_host_ed25519_key.pub]}
  - {name: install_dispatcher, script: base/debian/commands.sh}
  - {name: install_ca, script: base/debian/commands.sh, pve1_file_transfer: true}
