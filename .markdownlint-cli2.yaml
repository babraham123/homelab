# markdownlint-cli2 config, read by tools/check_rendered.sh (rendered docs), the pre-commit
# hook (planning/) and the VS Code markdownlint extension.
# Ref: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
# Every rule is on, with lines up to 100 columns; the options below are the exceptions.
---
config:
  default: true
  MD010:  # hard tabs; code blocks keep theirs, since patches and Makefiles need them
    code_blocks: false
  MD013:
    line_length: 100
    code_blocks: false
    tables: false
  MD024:  # duplicate headings: only among siblings, e.g. "Networking" under two nodes is fine
    siblings_only: true
  MD033:  # inline HTML: lists inside table cells only
    allowed_elements: [ul, li]
ignores:
  - "**/plugins-local/**"  # vendored upstream source
...
